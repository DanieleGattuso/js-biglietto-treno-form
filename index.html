<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    
    <title>Biglietto treno</title>
</head>
<body>
    
    <header>

        <h1>CALCOLA IL PREZZO DEL TUO BIGLIETTO</h1>

        



    </header>




    <main>


        <div class="credentials_container"> 

            <div class="credentials_form_container" id="micro">

                <div class="micro_container_credntials">
                    <ul>
                        <li><label for="name">Nome Cognome</label></li>
                        <li ><input id="nome_biglietto" type="text" id="name" placeholder="Inserisci il tuo nome" required /></li>
                    </ul>
                    
                    
                </div>

                <div class="micro_container_credntials" >

                    <ul>
                        <li> <label for="distance">Km da percorrere</label></li>
                        <li > <input id="km_biglietto" type="number" id="distance" placeholder="Inserisci i km" min="1" required /></li>
                    </ul>
                    
                    
                </div>

                <div class="micro_container_credntials">

                    <ul>
                        <li><label for="age">Fascia d'età</label></li>
                        <li ><select  id="age">
                            <option class="age_biglietto" value="maggiorenne">Maggiorenne</option>
                            <option class="age_biglietto" value="minorenne">Minorenne</option>
                            <option class="age_biglietto" value="over65">Over 65</option>
                        </select></li>
                    </ul>
                    
                    
                </div>
                
                
            </div>

            <div class="button_container">

                <button type="button"  class="btn btn-danger" >Annulla</button>
                <button type="button" class="btn btn-success" id="green_button">Genera</button>

            </div>


        </div>

        <div id="ticket-details" class="hidden ticket-layout">
            <h3>DETTAGLIO PASSEGGERI</h3>
            <div class="ticket-row">
              <div class="ticket-label">Nome Passeggero:</div>
              <div class="ticket-value"   id="passenger-name"></div>
            </div>
            <div class="ticket-row">
              <div class="ticket-label">Offerta:</div>
              <div class="ticket-value" id="ticket-offer"></div>
            </div>
            <div class="ticket-row">
              <div class="ticket-label">Carrozza:</div>
              <div class="ticket-value" id="carriage"></div>
            </div>
            <div class="ticket-row">
              <div class="ticket-label">Codice CP:</div>
              <div class="ticket-value" id="ticket-code"></div>
            </div>
            <div class="ticket-row">
              <div class="ticket-label">Costo Biglietto:</div>
              <div class="ticket-value" id="ticket-price"></div>
            </div>
          </div>










    </main>




    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
